<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WealthDesk | Bharat National Bank</title>
  <style>
    /*
     * TODO 8 (optional bonus): Style the chat UI using the WealthDesk palette.
     *
     * Color tokens:
     *   Dark navy background : #0B1120
     *   Surface (header/input): #131E35
     *   Card (bubbles)       : #1A2744
     *   Orange accent        : #F5A623
     *   Teal accent          : #2CC4B0
     *   Muted text           : #8899AA
     *   Border               : #2A3A5A
     *
     * The solution has a complete themed UI in s16/solution/frontend/index.html.
     * For now, a basic layout is enough — style it after the backend works.
     */
    body {
      font-family: system-ui, sans-serif;
      background: #0B1120;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      height: 100vh;
      margin: 0;
    }
    header {
      background: #131E35;
      padding: 14px 24px;
      border-bottom: 1px solid #2A3A5A;
    }
    header h1 { margin: 0; font-size: 18px; color: #F5A623; }
    header p  { margin: 2px 0 0; font-size: 12px; color: #8899AA; }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .message {
      max-width: 72%;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.5;
    }
    .message.user { background: #1E3A5F; align-self: flex-end; }
    .message.bot  { background: #1A2744; align-self: flex-start; }
    #input-area {
      background: #131E35;
      padding: 14px 24px;
      display: flex;
      gap: 10px;
      border-top: 1px solid #2A3A5A;
    }
    #user-input {
      flex: 1;
      background: #1A2744;
      border: 1px solid #2A3A5A;
      border-radius: 8px;
      color: #fff;
      padding: 10px 14px;
      font-size: 14px;
    }
    #send-btn {
      background: #F5A623;
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-weight: 700;
      cursor: pointer;
    }
    #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>

<header>
  <h1>WealthDesk</h1>
  <p>Bharat National Bank</p>
</header>

<div id="messages">
  <div class="message bot">Hello! I'm WealthDesk. Ask me about BNB rates, products, or branch information.</div>
</div>

<div id="input-area">
  <input type="text" id="user-input" placeholder="Ask about rates, loans, or branches…">
  <button id="send-btn" onclick="sendMessage()">Send</button>
</div>

<script>
  /*
   * TODO 5: Wire up the frontend to call POST /chat on the FastAPI backend.
   *
   * The /chat endpoint expects JSON: { message: "...", thread_id: "..." }
   * It returns JSON:  { response: "...", specialist: "...", blocked_reason: "...", compliance_status: "..." }
   *
   * Steps:
   *   1. Read the text from #user-input
   *   2. Call fetch("/chat", { method: "POST", headers: {...}, body: JSON.stringify({...}) })
   *   3. On success, append a .message.bot bubble with data.response
   *   4. On error, show the error message in a bot bubble
   *
   * Use a stable thread_id (e.g. crypto.randomUUID()) so multi-turn memory works.
   *
   * The solution is in s16/solution/frontend/index.html — look there if you get stuck.
   */

  const threadId = crypto.randomUUID();

  async function sendMessage() {
    const input = document.getElementById("user-input");
    const messages = document.getElementById("messages");
    const sendBtn = document.getElementById("send-btn");
    const text = input.value.trim();

    if (!text) return;
    sendBtn.disabled = true;

    // Show user's message immediately
    const userBubble = document.createElement("div");
    userBubble.className = "message user";
    userBubble.textContent = text;
    messages.appendChild(userBubble);
    input.value = "";
    messages.scrollTop = messages.scrollHeight;

    try {
      // TODO: call POST /chat with { message: text, thread_id: threadId }
      // const resp = await fetch("/chat", { ... });
      // const data = await resp.json();

      // TODO: append a .message.bot bubble with data.response
      // Remove or replace the placeholder below:
      const botBubble = document.createElement("div");
      botBubble.className = "message bot";
      botBubble.textContent = "TODO: implement fetch('/chat', ...) and display data.response";
      messages.appendChild(botBubble);
      messages.scrollTop = messages.scrollHeight;

    } catch (err) {
      const errBubble = document.createElement("div");
      errBubble.className = "message bot";
      errBubble.textContent = `Error: ${err.message}`;
      messages.appendChild(errBubble);
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  document.getElementById("user-input").addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendMessage();
  });
</script>
</body>
</html>
