<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WealthDesk | Bharat National Bank</title>
  <style>
    /* ── Design tokens ── */
    :root {
      --bg:       #0B1120;
      --surface:  #131E35;
      --card:     #1A2744;
      --orange:   #F5A623;
      --teal:     #2CC4B0;
      --white:    #FFFFFF;
      --dim:      #8899AA;
      --border:   #2A3A5A;
      --user-bg:  #1E3A5F;
      --bot-bg:   #1A2744;
      --radius:   12px;
      --font:     'Segoe UI', system-ui, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--white);
      font-family: var(--font);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    header .logo { font-size: 22px; }
    header .title { font-size: 18px; font-weight: 700; color: var(--orange); }
    header .subtitle { font-size: 12px; color: var(--dim); }
    header .badge {
      margin-left: auto;
      background: var(--card);
      border: 1px solid var(--teal);
      color: var(--teal);
      border-radius: 20px;
      padding: 3px 12px;
      font-size: 11px;
    }

    /* ── Messages ── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.55;
    }
    .message.user {
      background: var(--user-bg);
      border: 1px solid var(--border);
      align-self: flex-end;
    }
    .message.bot {
      background: var(--bot-bg);
      border: 1px solid var(--border);
      align-self: flex-start;
    }
    .message .meta {
      font-size: 11px;
      color: var(--dim);
      margin-top: 6px;
    }
    .message .meta .specialist {
      display: inline-block;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1px 8px;
      font-size: 10px;
      color: var(--teal);
    }
    .message .meta .blocked {
      display: inline-block;
      color: #FF6B6B;
      font-size: 10px;
    }
    .message-text { white-space: pre-wrap; word-break: break-word; }

    /* ── Typing indicator ── */
    .typing {
      align-self: flex-start;
      background: var(--bot-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
      display: none;
    }
    .typing.visible { display: flex; align-items: center; gap: 5px; }
    .typing span {
      width: 7px; height: 7px;
      background: var(--dim);
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-6px); }
    }

    /* ── Input area ── */
    #input-area {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      gap: 10px;
      flex-shrink: 0;
    }
    #user-input {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--white);
      padding: 12px 16px;
      font-size: 14px;
      font-family: var(--font);
      resize: none;
      outline: none;
      transition: border-color 0.2s;
    }
    #user-input:focus { border-color: var(--teal); }
    #user-input::placeholder { color: var(--dim); }
    #send-btn {
      background: var(--orange);
      color: #000;
      border: none;
      border-radius: var(--radius);
      padding: 12px 22px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    #send-btn:hover { opacity: 0.88; }
    #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Welcome message ── */
    .welcome {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      max-width: 520px;
      align-self: center;
      text-align: center;
      margin-top: 40px;
    }
    .welcome h2 { color: var(--orange); font-size: 18px; margin-bottom: 10px; }
    .welcome p  { color: var(--dim); font-size: 13px; line-height: 1.6; }
    .welcome .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 14px;
    }
    .chip {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 5px 14px;
      font-size: 12px;
      color: var(--teal);
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .chip:hover { border-color: var(--teal); }
  </style>
</head>
<body>

<header>
  <div class="logo">🏦</div>
  <div>
    <div class="title">WealthDesk</div>
    <div class="subtitle">Bharat National Bank</div>
  </div>
  <div class="badge" id="status-badge">Connecting…</div>
</header>

<div id="messages">
  <div class="welcome" id="welcome">
    <h2>Welcome to WealthDesk</h2>
    <p>Your AI assistant for BNB products, interest rates, and branch information.</p>
    <div class="chips">
      <div class="chip" onclick="fillInput('What are the home loan interest rates?')">Home loan rates</div>
      <div class="chip" onclick="fillInput('Tell me about FD rates for senior citizens')">FD rates</div>
      <div class="chip" onclick="fillInput('Where is the nearest BNB branch in Mumbai?')">Branch locator</div>
      <div class="chip" onclick="fillInput('What documents do I need for a personal loan?')">Loan documents</div>
    </div>
  </div>
</div>

<div class="typing" id="typing">
  <span></span><span></span><span></span>
</div>

<div id="input-area">
  <textarea
    id="user-input"
    rows="1"
    placeholder="Ask about rates, products, or branch information…"
  ></textarea>
  <button id="send-btn" onclick="sendMessage()">Send</button>
</div>

<script>
  const API_URL   = "";                         // same origin — FastAPI serves this file
  const threadId  = crypto.randomUUID();
  const messages  = document.getElementById("messages");
  const input     = document.getElementById("user-input");
  const sendBtn   = document.getElementById("send-btn");
  const typing    = document.getElementById("typing");
  const badge     = document.getElementById("status-badge");
  let   welcomeEl = document.getElementById("welcome");

  // ── Health check on load ──────────────────────────────────────────────────
  async function checkHealth() {
    try {
      const r = await fetch(`${API_URL}/health`);
      if (r.ok) {
        badge.textContent = "● Online";
        badge.style.color = "var(--teal)";
      } else throw new Error();
    } catch {
      badge.textContent = "● Offline";
      badge.style.color = "#FF6B6B";
    }
  }
  checkHealth();

  // ── Auto-resize textarea ──────────────────────────────────────────────────
  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 120) + "px";
  });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  // ── Quick-fill chips ──────────────────────────────────────────────────────
  function fillInput(text) {
    input.value = text;
    input.focus();
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 120) + "px";
  }

  // ── Append a message bubble ───────────────────────────────────────────────
  function appendMessage(role, text, meta = {}) {
    if (welcomeEl) { welcomeEl.remove(); welcomeEl = null; }

    const div = document.createElement("div");
    div.className = `message ${role}`;

    const textEl = document.createElement("div");
    textEl.className = "message-text";
    textEl.textContent = text;
    div.appendChild(textEl);

    if (role === "bot" && (meta.specialist || meta.blockedReason)) {
      const metaEl = document.createElement("div");
      metaEl.className = "meta";
      if (meta.blockedReason) {
        const b = document.createElement("span");
        b.className = "blocked";
        b.textContent = `⛔ Blocked: ${meta.blockedReason}`;
        metaEl.appendChild(b);
      } else if (meta.specialist) {
        const s = document.createElement("span");
        s.className = "specialist";
        s.textContent = meta.specialist;
        metaEl.appendChild(s);
      }
      div.appendChild(metaEl);
    }

    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  // ── Main send handler ─────────────────────────────────────────────────────
  async function sendMessage() {
    const text = input.value.trim();
    if (!text || sendBtn.disabled) return;

    appendMessage("user", text);
    input.value = "";
    input.style.height = "auto";
    sendBtn.disabled = true;

    // Show typing indicator
    messages.appendChild(typing);
    typing.classList.add("visible");
    messages.scrollTop = messages.scrollHeight;

    try {
      const resp = await fetch(`${API_URL}/chat`, {
        method:  "POST",
        headers: { "Content-Type": "application/json" },
        body:    JSON.stringify({ message: text, thread_id: threadId }),
      });

      typing.classList.remove("visible");
      if (messages.lastChild === typing) messages.removeChild(typing);

      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        appendMessage("bot", `Error: ${err.detail || resp.statusText}`);
        return;
      }

      const data = await resp.json();
      appendMessage("bot", data.response || "(no response)", {
        specialist:   data.specialist,
        blockedReason: data.blocked_reason,
      });
    } catch (err) {
      typing.classList.remove("visible");
      if (messages.lastChild === typing) messages.removeChild(typing);
      appendMessage("bot", `Connection error: ${err.message}. Is the API running?`);
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }
</script>
</body>
</html>
